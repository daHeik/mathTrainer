<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chicken Shooter · Grafikprüfung</title>
<style>body{margin:0;background:#eaece2;color:#405c50;font:16px system-ui;padding:20px}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0;background:#faf7e8;border-radius:20px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:5/3}figcaption{padding:12px}iframe{border:0;width:390px;height:760px;border-radius:24px}button{padding:12px;border:0;border-radius:12px;background:#3c6f59;color:#fff;font:inherit}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<h1>Chicken Shooter · Szenen, Figuren und mobiles Layout</h1><p>Lokale Grafikprüfung mit reproduzierbaren Figuren. <button id="motion">Animation starten</button></p><main id="gallery"></main><h2>Schmale Spielansicht · 390 × 760</h2><iframe loading="lazy" src="../index.html?demo=chicken" title="Mobiler Chicken Shooter"></iframe>
<script src="../chicken-shooter.js"></script><script>
var examples=[['Herbst',new Date(2026,10,8)],['Frühling',new Date(2026,4,5)],['Sommer',new Date(2026,7,5)],['Winter / Weihnachten',new Date(2026,11,15)],['Halloween',new Date(2026,9,25)],['Ostern',new Date(2026,3,5)]],games=[];
examples.forEach(function(example){var figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=1600;canvas.height=960;caption.textContent=example[0];figure.appendChild(canvas);figure.appendChild(caption);document.getElementById('gallery').appendChild(figure);var g=ChickenShooter.create(function(){return .5;},example[1]);g.elapsed=12;g.running=true;g.targets=[];
for(var i=0;i<5;i++){var bird={born:0,layer:i%3,r:29+i%3*3,speed:70+i*25,direction:i%2?-1:1,baseY:175+i%2*90,phase:i,character:i,vehicle:[null,null,'plane','balloon','glider'][i],flap:2.4+i*.5,frequency:.8+i*.2,amplitude:12+i*6,flight:['hover','flutter','swoop','balloon','glide'][i],points:50};var p=ChickenShooter.position(g,bird);bird.offsetX=120+i*185-p.x;g.targets.push(bird);}g.visitors=[{visitor:'peek',born:11.5,duration:3,layer:2,r:18,direction:1,phase:0,character:1,points:55},{visitor:g.theme.season==='winter'?'skater':'diver',born:11.5,duration:g.theme.season==='winter'?6:2,layer:3,r:21,direction:1,phase:0,character:3,points:65}];games.push({game:g,canvas:canvas});});
var running=false,last=0,painted=false;function draw(now){if(running||!painted)games.forEach(function(item){if(running&&last)item.game.elapsed+=(now-last)/1000;var c=item.canvas.getContext('2d');c.setTransform(1.6,0,0,1.6,0,0);ChickenShooter.draw(c,item.game,false);});painted=true;last=now;requestAnimationFrame(draw);}requestAnimationFrame(draw);document.getElementById('motion').onclick=function(){running=!running;this.textContent=running?'Animation anhalten':'Animation starten';};
</script></html>
