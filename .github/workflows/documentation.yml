name: Dokumentation prüfen
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-docs.txt
      - run: python scripts/build_docs.py --output-dir "$RUNNER_TEMP/manuals"
      - run: python scripts/build_docs.py --check --output-dir "$RUNNER_TEMP/manuals"
